<!doctype html>
<html lang="en" class="scroll-smooth">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			try {
				document.documentElement.classList.toggle('dark', localStorage.getItem('theme') === 'dark');
			} catch {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="bg-white text-neutral-900 transition-colors duration-500 dark:bg-neutral-950 dark:text-neutral-100 [&_*]:transition-all [&_*]:duration-500">
		<div class="contents">%sveltekit.body%</div>
	</body>
</html>
